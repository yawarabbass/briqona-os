<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Briqona OS</title>

<link rel="stylesheet" href="../css/style.css">

<style>
.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f7f8fc;
    padding:40px 20px;
}

.login-card{
    width:100%;
    max-width:450px;
    background:white;
    border-radius:28px;
    padding:45px 35px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.login-logo{
    text-align:center;
    font-size:28px;
    font-weight:800;
    margin-bottom:10px;
}

.login-logo span{
    color:#5b4bdb;
}

.login-title{
    text-align:center;
    font-size:32px;
    color:#101828;
    margin-bottom:10px;
}

.login-text{
    text-align:center;
    color:#667085;
    margin-bottom:35px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#344054;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:16px;
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#5b4bdb;
    color:white;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}

.login-options{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
    font-size:14px;
}

.login-options a{
    color:#5b4bdb;
    text-decoration:none;
}

.signup-text{
    text-align:center;
    margin-top:25px;
    color:#667085;
}

.signup-text a{
    color:#5b4bdb;
    font-weight:700;
}
</style>

</head>

<body>


<div class="login-page">

<div class="login-card">

<div class="login-logo">
BRIQONA<span>OS</span>
</div>

<h1 class="login-title">
Welcome Back
</h1>

<p class="login-text">
Login to manage your business operating system.
</p>


<form>

<div class="form-group">
<label>Email Address</label>
<input type="email" placeholder="Enter your email">
</div>


<div class="form-group">
<label>Password</label>
<input type="password" placeholder="Enter your password">
</div>


<div class="login-options">

<label>
<input type="checkbox">
 Remember me
</label>

<a href="forgot-password.html">
Forgot password?
</a>

</div>


<button class="login-btn">
Login
</button>


</form>


<p class="signup-text">
Don't have an account?
<a href="register.html">
Create account
</a>
</p>


</div>

</div>


</body>
</html>
