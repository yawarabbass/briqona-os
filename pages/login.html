<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign In | BRIQONA OS</title>

  <meta
    name="description"
    content="Sign in to BRIQONA OS, the unified operating system for modern businesses."
  >

  <meta
    name="keywords"
    content="BRIQONA OS login, business operating system, business management software"
  >

  <meta name="author" content="Yawar Abbas Bhatti">
  <meta name="robots" content="noindex, nofollow">

  <link
    rel="canonical"
    href="https://briqona-os.vercel.app/pages/login.html"
  >

  <meta
    property="og:title"
    content="Sign In | BRIQONA OS"
  >

  <meta
    property="og:description"
    content="Secure access to your BRIQONA OS workspace."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://briqona-os.vercel.app/pages/login.html"
  >

  <meta
    name="twitter:card"
    content="summary"
  >

  <link
    rel="stylesheet"
    href="../css/style.css"
  >

  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .auth-shell {
      width: min(100%, 460px);
    }

    .auth-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .auth-card {
      padding: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 26px;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(216, 255, 69, 0.08),
          transparent 40%
        ),
        var(--surface);
      box-shadow: var(--shadow);
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-heading h1 {
      margin: 12px 0 8px;
      font-size: 36px;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .auth-heading p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .auth-form {
      display: grid;
      gap: 17px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--text-soft);
      font-size: 11px;
      font-weight: 750;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: #0a0c10;
      font-size: 13px;
      transition:
        border-color var(--transition),
        box-shadow var(--transition);
    }

    .field input:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .password-row {
      position: relative;
    }

    .password-row input {
      padding-right: 78px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      padding: 6px 8px;
      border-radius: 7px;
      color: var(--text-muted);
      background: transparent;
      font-size: 10px;
      font-weight: 750;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: var(--accent);
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
    }

    .remember input {
      accent-color: var(--accent);
    }

    .forgot {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    .auth-submit {
      width: 100%;
      margin-top: 5px;
    }

    .auth-message {
      min-height: 18px;
      margin: 0;
      color: var(--success);
      text-align: center;
      font-size: 11px;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: var(--text-muted);
      font-size: 9px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .back-home {
      display: block;
      color: var(--text-muted);
      text-align: center;
      font-size: 11px;
    }

    .back-home:hover {
      color: var(--text);
    }

    .auth-footer {
      margin-top: 22px;
      color: #555b66;
      text-align: center;
      font-size: 9px;
    }

    @media (max-width: 520px) {
      .auth-page {
        padding: 25px 14px;
      }

      .auth-card {
        padding: 25px 18px;
        border-radius: 20px;
      }

      .auth-heading h1 {
        font-size: 31px;
      }

      .auth-options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="auth-shell">

      <div class="auth-brand">
        <a
          class="brand"
          href="../index.html"
          aria-label="BRIQONA OS home"
        >
          <span class="brand-mark">B</span>

          <span class="brand-name">
            BRIQONA<span>OS</span>
          </span>
        </a>
      </div>

      <section
        class="auth-card"
        aria-labelledby="login-title"
      >

        <div class="auth-heading">

          <span class="eyebrow">
            <span class="status-dot"></span>
            Secure workspace
          </span>

          <h1 id="login-title">
            Welcome back.
          </h1>

          <p>
            Sign in to continue to your BRIQONA OS workspace.
          </p>

        </div>

        <form
          class="auth-form"
          id="loginForm"
          action="#"
          method="post"
        >

          <div class="field">

            <label for="email">
              Work email
            </label>

            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@company.com"
              required
            >

          </div>

          <div class="field">

            <label for="password">
              Password
            </label>

            <div class="password-row">

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                minlength="8"
                required
              >

              <button
                class="password-toggle"
                type="button"
                id="passwordToggle"
                aria-label="Show password"
              >
                Show
              </button>

            </div>

          </div>

          <div class="auth-options">

            <label class="remember">

              <input
                type="checkbox"
                name="remember"
              >

              <span>
                Remember me
              </span>

            </label>

            <a
              class="forgot"
              href="#"
              id="forgotPassword"
            >
              Forgot password?
            </a>

          </div>

          <button
            class="btn btn-primary auth-submit"
            type="submit"
          >
            Sign in
            <span aria-hidden="true">→</span>
          </button>

          <p
            class="auth-message"
            id="authMessage"
            aria-live="polite"
          ></p>

        </form>

        <div class="auth-divider">
          OR
        </div>

        <a
          class="back-home"
          href="../index.html"
        >
          ← Back to BRIQONA OS
        </a>

      </section>

      <p class="auth-footer">
        BRIQONA OS · Business operating system
      </p>

    </div>

  </main>

  <script>
    const passwordInput =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const loginForm =
      document.getElementById("loginForm");

    const authMessage =
      document.getElementById("authMessage");

    const forgotPassword =
      document.getElementById("forgotPassword");


    passwordToggle.addEventListener("click", () => {

      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      passwordToggle.textContent =
        isPassword ? "Hide" : "Show";

      passwordToggle.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password"
      );

    });


    loginForm.addEventListener("submit", (event) => {

      event.preventDefault();

      if (!loginForm.checkValidity()) {
        loginForm.reportValidity();
        return;
      }

      authMessage.textContent =
        "Login interface ready — authentication will be connected to the BRIQONA OS backend.";

    });


    forgotPassword.addEventListener("click", (event) => {

      event.preventDefault();

      authMessage.textContent =
        "Password recovery will be connected when the authentication backend is enabled.";

    });
  </script>

</body>
</html>
